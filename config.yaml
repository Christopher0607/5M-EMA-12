# NQ 5-min EMA12 opening-range strategy — all tunables live here.

data:
  dataset: GLBX.MDP3
  # Volume-rank continuous, NOT calendar-rank (.c.0). On expiry week .c.0 stays
  # in the dying front month: 2024-09-20 showed 380 contracts in the 09:30 hour
  # versus 68,278 for .v.0. Trading .c.0 there would be fiction.
  symbol: NQ.v.0
  stype_in: continuous
  schema: ohlcv-1m
  start: "2010-06-06"      # dataset inception for GLBX.MDP3
  end:   "2026-08-29"      # exclusive
  cache_dir: data
  max_spend_usd: 18.0      # hard guard; fetch aborts if estimate exceeds this

contract:
  # We buy NQ price data but simulate MNQ (micro) contract specs.
  # Same underlying, same price; only point value differs.
  name: MNQ
  point_value: 2.0         # USD per index point
  tick_size: 0.25
  tick_value: 0.50

account:
  initial_capital: 50000.0
  risk_pct: 0.01           # 1% of initial capital = $500 stop loss
  # TopStep's real cap is 50 micros on a $50K (10:1 micro-to-mini, 5 minis).
  # The previous value of 10 was 5x too tight and bound on 89% of trades, so it -
  # not the 1% risk rule - was setting position size. Per-tier caps live under
  # topstep_tiers below; this is the default for the single-account scripts.
  max_contracts: 50

costs:
  commission_rt: 1.34      # USD round-turn per micro contract
  slippage_ticks: 1        # ticks of slippage on each fill (entry and exit)

strategy:
  signal_local_time: "09:30"   # ET; the 09:30-09:35 bar is the signal bar
  timezone: America/New_York
  bar_minutes: 5
  ema_period: 12
  atr_period: 14
  max_hold_hours: 6

variants:
  atr:                     # V1 (headline): D = k * ATR14, contracts sized to 1% risk
    k: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
    default_k: 1.0
  pct:                     # V2: D = p * entry_price, contracts sized to 1% risk
    p: [0.0025, 0.005, 0.0075, 0.01]
    default_p: 0.005
  fixed:                   # V3 (literal): N contracts, D = risk$ / (N * point_value)
    n: [1, 2, 5, 10]
    default_n: 1

propfirm:
  apex_50k:
    balance: 50000.0
    trailing_dd: 2500.0
    profit_target: 3000.0
    trail_basis: intraday      # threshold follows highest intraday equity
    lock_at_initial: true      # stops trailing once threshold reaches start balance
    daily_loss_limit: null
  topstep_50k:
    balance: 50000.0
    trailing_dd: 2000.0
    profit_target: 3000.0
    trail_basis: eod           # threshold follows end-of-day balance
    lock_at_initial: true
    daily_loss_limit: 1000.0

# ---------------------------------------------------------------------------
# Funded ("PA") phase and payout rules.
#
# Prop-firm terms change frequently and differ by promotion. These model the
# publicly documented 2024-2025 $50K programmes. Every number is here rather
# than in code so it can be corrected without touching the simulator.
# ---------------------------------------------------------------------------
funded:
  apex_50k:
    balance: 50000.0
    trailing_dd: 2500.0
    trail_basis: intraday
    lock_at_initial: true
    daily_loss_limit: null
    min_trading_days: 8          # qualifying days before a payout may be requested
    min_day_profit: 50.0         # a day counts as qualifying at or above this
    safety_net: 52600.0          # balance must stay at/above this after withdrawal
    payout_cap: 2000.0           # cap on the first `capped_payouts` withdrawals
    capped_payouts: 3
    consistency_max_day_share: 0.30   # no single day may exceed 30% of total profit
    split_full_to: 25000.0       # 100% of profit up to here ...
    split_after: 1.0             # ... and this share beyond it
  topstep_50k:
    balance: 50000.0
    trailing_dd: 2000.0
    trail_basis: eod
    lock_at_initial: true
    daily_loss_limit: 1000.0
    min_trading_days: 5          # Standard path: 5 winning days ...
    min_day_profit: 150.0        # ... of net P&L >= $150 (was $200 before 2026)
    safety_net: 50000.0
    payout_cap: 2000.0           # Standard path cap on a $50K, post 2026-04-28
    capped_payouts: null         # null = the cap applies to every payout
    consistency_max_day_share: null
    split_full_to: 0.0           # traders joining after 2026-01-12 get ...
    split_after: 0.9             # ... a flat 90/10 from the first dollar

withdrawal_policies:
  immediate:   {kind: all}                  # everything above the safety net
  half_buffer: {kind: fraction, value: 0.5} # half the excess, keep a cushion
  accumulate:  {kind: threshold, value: 2000.0}  # only once the excess clears $2,000

fees:
  promo:       # what most people actually pay - Apex discounts run most months
    apex_50k:    {evaluation: 35.0,  activation: 0.0,  monthly_funded: 85.0}
    topstep_50k: {evaluation: 49.0,  activation: 0.0,  monthly_funded: 49.0}
  list:        # undiscounted
    apex_50k:    {evaluation: 167.0, activation: 0.0,  monthly_funded: 85.0}
    topstep_50k: {evaluation: 165.0, activation: 0.0,  monthly_funded: 165.0}

walkforward:
  select_metric: net_pnl       # the same metric that produced N=2, so the test is fair
  min_train_years: 2
  holdout_split_year: 2018     # select on < this year, report on >= this year

# ---------------------------------------------------------------------------
# TopStep account tiers (2026 published terms).
# Contract limits scale 10:1 micro-to-mini: 5/10/15 minis = 50/100/150 micros.
# The Combine consistency rule gates *passing* the evaluation, not withdrawing,
# so it is applied in run_account rather than in the funded phase.
# ---------------------------------------------------------------------------
topstep_tiers:
  50k:
    balance: 50000.0
    trailing_dd: 2000.0
    daily_loss_limit: 1000.0
    profit_target: 3000.0
    max_micros: 50
    trail_basis: eod
    lock_at_initial: true
    consistency_max_day_vs_target: 0.50   # best day <= 50% of the profit target
  100k:
    balance: 100000.0
    trailing_dd: 3000.0
    daily_loss_limit: 2000.0
    profit_target: 6000.0
    max_micros: 100
    trail_basis: eod
    lock_at_initial: true
    consistency_max_day_vs_target: 0.50
  150k:
    balance: 150000.0
    trailing_dd: 4500.0
    daily_loss_limit: 3000.0
    profit_target: 9000.0
    max_micros: 150
    trail_basis: eod
    lock_at_initial: true
    consistency_max_day_vs_target: 0.50

# How a tier turns into a per-trade dollar risk. The choice decides whether a
# bigger account is an advantage: the MLL scales 2.25x from 50K to 150K while a
# 1%-of-balance risk scales 3x, so under pct_balance the large account is
# *relatively tighter* (3 full losses to bust against the 50K's 4).
risk_bases:
  fixed_dollar: {kind: fixed, value: 500.0}      # same size everywhere; extra MLL is pure cushion
  pct_balance:  {kind: pct_balance, value: 0.01}
  pct_mll:      {kind: pct_mll, value: 0.25}     # constant 4-losses-to-bust across tiers

# TopStep funded payout paths (post 2026-04-28 caps).
payout_paths:
  standard:
    min_trading_days: 5
    min_day_profit: 150.0
    consistency_max_day_share: null
    caps: {50k: 2000.0, 100k: 3000.0, 150k: 5000.0}
  consistency:
    min_trading_days: 3
    min_day_profit: 150.0
    consistency_max_day_share: 0.40   # 40% consistency target
    caps: {50k: 3000.0, 100k: 6000.0, 150k: 6000.0}

# Parallel funded accounts run from one signal with a copier. They are perfectly
# correlated - identical trajectories, identical bust day - so the total is an
# exact multiple, with no diversification. The per-account payout cap is the one
# real reason to add accounts; the legacy 100%-of-first-$10k threshold is per
# trader and does NOT multiply.
scaling:
  account_counts: [1, 2, 3, 5, 10]
  legacy_split_full_to: 10000.0   # only for pre-2026-01-12 traders; shared across accounts

# ---------------------------------------------------------------------------
# Four-firm comparison. Terms as published for 2026; every number is here so it
# can be corrected without touching the simulator.
#
# The structural differences matter more than the numbers:
#   Apex     - threshold trails the INTRADAY high, both phases. Hardest to hold.
#   TopStep  - trails the CLOSING balance; hard daily loss limit kills the account.
#   Lucid    - trails EOD in evaluation, then stops trailing once funded. Daily
#              loss limit is a SOFT breach: it blocks trading for the rest of the
#              day but does not bust you.
#              AMBIGUITY: Lucid says the drawdown "converts to a static floor at
#              the starting balance". That reads two ways - a floor pinned at
#              balance-MLL (a permanent cushion) or one at the starting balance
#              (no cushion). Modelled here the conservative way, as a threshold
#              that trails up to the starting balance and then locks, which is
#              the standard industry mechanic and never flatters Lucid. Flip
#              static_floor to true to model the generous reading.
#   TPT      - evaluation trails EOD with no daily limit, but the funded PRO
#              account switches to INTRADAY trailing. The one firm that gets
#              HARDER after you pass.
#
# TPT publishes only its endpoints (1 mini / 10 micros at $25K, 5 / 50 at $150K;
# max drawdown $1,500 at $25K to $4,500 at $150K). The $50K and $100K rows below
# are interpolated on that ladder and are marked as such.
# ---------------------------------------------------------------------------
firms:
  apex:
    label: "Apex"
    split_full_to: 25000.0
    split_after: 1.0
    eval:   {trail_basis: intraday, lock_at_initial: true, static_floor_when_funded: false}
    funded: {trail_basis: intraday, lock_at_initial: true, static_floor: false,
             min_trading_days: 8, min_day_profit: 50.0, payout_cap: 2000.0,
             capped_payouts: 3, consistency_max_day_share: 0.30,
             safety_net_offset: 2600.0}
    tiers:
      50k:  {balance: 50000.0,  trailing_dd: 2500.0, profit_target: 3000.0,
             daily_loss_limit: null, max_micros: 100}
      100k: {balance: 100000.0, trailing_dd: 3000.0, profit_target: 6000.0,
             daily_loss_limit: null, max_micros: 140}
      150k: {balance: 150000.0, trailing_dd: 5000.0, profit_target: 9000.0,
             daily_loss_limit: null, max_micros: 170}

  topstep:
    label: "TopStep"
    split_full_to: 0.0
    split_after: 0.9
    eval:   {trail_basis: eod, lock_at_initial: true, consistency_max_day_vs_target: 0.50,
             daily_loss_soft: false}
    funded: {trail_basis: eod, lock_at_initial: true, static_floor: false,
             min_trading_days: 5, min_day_profit: 150.0,
             capped_payouts: null, consistency_max_day_share: null,
             safety_net_offset: 0.0, daily_loss_soft: false}
    tiers:
      50k:  {balance: 50000.0,  trailing_dd: 2000.0, profit_target: 3000.0,
             daily_loss_limit: 1000.0, max_micros: 50,  payout_cap: 2000.0}
      100k: {balance: 100000.0, trailing_dd: 3000.0, profit_target: 6000.0,
             daily_loss_limit: 2000.0, max_micros: 100, payout_cap: 3000.0}
      150k: {balance: 150000.0, trailing_dd: 4500.0, profit_target: 9000.0,
             daily_loss_limit: 3000.0, max_micros: 150, payout_cap: 5000.0}

  lucid:
    label: "Lucid (LucidPro)"
    split_full_to: 0.0
    split_after: 0.9              # 90/10
    # LucidPro has no minimum trading days and no evaluation consistency rule,
    # which is what makes a one-day pass possible.
    eval:   {trail_basis: eod, lock_at_initial: true, daily_loss_soft: true}
    funded: {trail_basis: eod, lock_at_initial: true, static_floor: false,
             min_trading_days: 0, min_day_profit: 0.0,
             payout_cap: null, capped_payouts: 0,
             consistency_max_day_share: 0.40,   # 40% of profit in the payout cycle
             safety_net_offset: 0.0, daily_loss_soft: true}
    tiers:
      50k:  {balance: 50000.0,  trailing_dd: 2000.0, profit_target: 3000.0,
             daily_loss_limit: 1200.0, max_micros: 40}
      100k: {balance: 100000.0, trailing_dd: 3000.0, profit_target: 6000.0,
             daily_loss_limit: 1800.0, max_micros: 60}
      150k: {balance: 150000.0, trailing_dd: 4500.0, profit_target: 9000.0,
             daily_loss_limit: 2700.0, max_micros: 100}

  tpt:
    label: "Take Profit Trader (PRO)"
    split_full_to: 0.0
    split_after: 0.8              # 80/20 on PRO; PRO+ is 90/10 but invite-only
    # The Test evaluation has no daily loss limit and trails EOD, but the funded
    # PRO account switches to INTRADAY trailing - the one firm that gets harder
    # after you pass.
    eval:   {trail_basis: eod, lock_at_initial: true, min_days_to_pass: 5,
             consistency_max_day_share: 0.50}
    funded: {trail_basis: intraday, lock_at_initial: true, static_floor: false,
             min_trading_days: 5, min_day_profit: 0.0,
             payout_cap: null, capped_payouts: 0,
             consistency_max_day_share: 0.50,   # no day > 50% of lifetime profit
             safety_net_offset: 0.0}
    tiers:
      50k:  {balance: 50000.0,  trailing_dd: 2000.0, profit_target: 3000.0,
             daily_loss_limit: null, max_micros: 20}   # interpolated
      100k: {balance: 100000.0, trailing_dd: 3000.0, profit_target: 6000.0,
             daily_loss_limit: null, max_micros: 40}   # interpolated
      150k: {balance: 150000.0, trailing_dd: 4500.0, profit_target: 9000.0,
             daily_loss_limit: null, max_micros: 50}

firm_fees:      # promotional pricing, which is what most people actually pay
  apex:    {evaluation: 35.0,  activation: 0.0, monthly_funded: 85.0}
  topstep: {evaluation: 49.0,  activation: 0.0, monthly_funded: 49.0}
  lucid:   {evaluation: 45.0,  activation: 0.0, monthly_funded: 0.0}
  tpt:     {evaluation: 60.0,  activation: 0.0, monthly_funded: 0.0}
